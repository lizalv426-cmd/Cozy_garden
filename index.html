<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Уютный Гербарий</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b2b2b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            margin: 0 auto;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Перелив солнечного света */
        #game-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 236, 179, 0.25) 0%, rgba(255, 213, 79, 0.05) 50%, transparent 100%);
            pointer-events: none; 
            z-index: 2;
            animation: sunlightPulse 8s ease-in-out infinite;
        }

        @keyframes sunlightPulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; } 
            100% { opacity: 0.3; }
        }

        /* Стол */
        #game-table {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            pointer-events: none;
            z-index: 5;
        }
/* Позиционирование котика на кресле */
        #game-cat {
            position: absolute;
            bottom: 390px;   /* Высота от пола */
            left: 50%;       /* Двигаем к центру */
            transform: translateX(-45px); /* Сдвигаем левее на кресло */
            width: 80px;     /* Размер котика */
            height: auto;
            pointer-events: none; 
            z-index: 4;      
        }

        /* Горшочек на столе */
        #game-pot {
            position: absolute;
            bottom: 220px; 
            left: 50%;
            transform: translateX(-50%);
            width: 130px; 
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 10;
        }
        #game-pot:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ПРАВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ */
        #right-panel {
            position: absolute;
            right: 15px; 
            top: 15px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 30;
        }

        .tool-btn {
            width: 90px; 
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        .tool-btn:active {
            transform: scale(0.92);
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ МОНЕТ */
        #ui-top-left {
            position: absolute;
            top: 15px;
            left: 15px; 
            z-index: 30;
        }
        #coin-panel-wrapper {
            position: relative;
            width: 180px; 
            height: auto;
        }
        #coin-img {
            width: 100%;
            height: auto;
        }
        #coins-text {
            position: absolute;
            right: 30px; 
            top: 56%; 
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #312117;
        }

        /* КНОПКА КАТАЛОГА */
        #catalog-wrapper {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px; 
            z-index: 30;
        }
        #btn-catalog {
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        #btn-catalog:active {
            transform: scale(0.95);
        }

        /* КНОПКА МУЗЫКИ В ПРАВОМ НИЖНЕМ УГЛУ */
        #music-wrapper {
            position: absolute;
            bottom: 15px;    
            right: 15px;     
            width: 60px;     
            height: auto;
            z-index: 30;
        }
        #btn-music {
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        #btn-music:active {
            transform: scale(0.9);
        }
        #btn-music.muted {
            filter: grayscale(100%) opacity(50%);
        }

        /* УЮТНАЯ ПЛАШКА ПОДСКАЗОК С КОТИКОМ */
        #hint-wrapper {
            position: absolute;
            top: 125px; 
            left: 15px; 
            width: 320px; 
            height: auto;
            z-index: 25;
        }
        #hint-bg {
            width: 100%;
            height: auto;
            display: block;
        }
        #game-hint {
            position: absolute;
            left: 35px;   
            right: 75px;  
            top: 48%;
            transform: translateY(-50%);
            text-align: center;
            color: #4a3b32;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Фоновый плеер для аудио -->
        <audio id="bg-music" src="music.mp3" loop></audio>
<img id="game-cat" src=" cat_sleep.png" alt="Спящий котик">
        <!-- Графические элементы игры -->
        <img id="game-table" src="table.png" alt="Игровой стол">
        <img id="game-pot" src="pot_empty.png" alt="Горшочек" onclick="clickPot()">

        <!-- Панель подсказок -->
        <div id="hint-wrapper">
            <img id="hint-bg" src="panel_hint.png" alt="Панель подсказок">
            <div id="game-hint">Выберите инструмент «Земля» справа</div>
        </div>

        <!-- Кнопки инструментов справа -->
        <div id="right-panel">
            <img id="btn-dirt" class="tool-btn" src="btn_dirt.png" alt="Земля" onclick="selectTool('dirt')">
            <img id="btn-water" class="tool-btn" src="btn_water.png" alt="Вода" onclick="selectTool('water')">
            <img id="btn-seed" class="tool-btn" src="btn_seed.png" alt="Семена" onclick="selectTool('seed')">
        </div>

        <!-- Левая верхняя плашка монет -->
        <div id="ui-top-left">
            <div id="coin-panel-wrapper">
                <img id="coin-img" src="panel_coins.png" alt="Монеты">
                <div id="coins-text"><span id="coins">0</span></div>
            </div>
        </div>

        <!-- Нижняя кнопка каталога -->
        <div id="catalog-wrapper">
            <img id="btn-catalog" src="btn_catalog.png" alt="Каталог растений" onclick="openCatalog()">
        </div>

        <!-- Нижняя кнопка музыки справа -->
        <div id="music-wrapper">
            <img id="btn-music" src="btn_music.png" alt="Музыка" onclick="toggleMusic()">
        </div>
    </div>

    <script>
        let currentStage = 0; 
        let coins = 0;
        let selectedTool = null;
        let musicStarted = false;
        let isMuted = false;

        const potElement = document.getElementById('game-pot');
        const coinsElement = document.getElementById('coins');
        const hintElement = document.getElementById('game-hint');
        const musicElement = document.getElementById('bg-music');
        const btnMusic = document.getElementById('btn-music');

        // Автоматически подгружаем сохранения
        loadGame();

        // Проверяем и запускаем трек при первом клике игрока
        function startMusic() {
            if (!musicStarted && !isMuted) {
                musicElement.volume = 0.3; // Умеренная громкость 30%
                musicElement.play().catch(function(e) {
                    console.log("Ожидание взаимодействия для запуска звука");
                });
                musicStarted = true;
            }
        }

        // Кнопка звука
        function toggleMusic() {
            if (!musicStarted) {
                musicStarted = true;
                musicElement.volume = 0.3;
                musicElement.play();
            }

            if (isMuted) {
                musicElement.muted = false;
                isMuted = false;
                btnMusic.classList.remove('muted');
            } else {
                musicElement.muted = true;
                isMuted = true;
                btnMusic.classList.add('muted');
            }
        }

        function selectTool(tool) {
            startMusic(); 
            
            // Сбрасываем визуальные стили активности со всех кнопок
            document.querySelectorAll('.tool-btn').forEach(function(btn) {
                btn.style.filter = 'none';
                btn.style.transform = 'none';
            });
            
            if (selectedTool === tool) {
                selectedTool = null;
                updateHint();
            } else {
                selectedTool = tool;
                // Подсвечиваем выбранную кнопочку
                const activeBtn = document.getElementById('btn-' + tool);
                if (activeBtn) {
                    activeBtn.style.filter = 'drop-shadow(0 0 8px rgba(230, 95, 43, 0.8)) scale(1.05)';
                }
                
                if (tool === 'dirt') hintElement.innerText = "Кликните на горшочек, чтобы насыпать землю";
                if (tool === 'seed') hintElement.innerText = "Кликните на горшочек, чтобы посадить семена";
                if (tool === 'water') hintElement.innerText = "Кликните на горшочек, чтобы полить росток";
            }
        }

               function clickPot() {
            try { startMusic(); } catch(e) { console.log(e); }
            
            if (currentStage === 0 && selectedTool === 'dirt') {
                currentStage = 1;
                potElement.src = 'pot_dirt.png';
                resetTool();
                updateHint();
                saveGame(); 
            } 
            else if (currentStage === 1 && selectedTool === 'seed') {
                currentStage = 2;
                potElement.src = 'pot_sprout.png'; 
                resetTool();
                updateHint();
                saveGame();
            } 
            else if (currentStage === 2 && selectedTool === 'water') {
                currentStage = 3;
                potElement.src = 'pot_flower.png';
                resetTool();
                updateHint();
                saveGame();
            } 
            else if (currentStage === 3) {
                coins += 150; 
                coinsElement.innerText = coins;
                currentStage = 0;
                potElement.src = 'pot_empty.png';
                updateHint();
                saveGame();
            }
            else {
                if (currentStage === 3) {
                    hintElement.innerText = "Соберите выросший суккулент пальчиком!";
                } else {
                    hintElement.innerText = "Этот инструмент сейчас не подходит сюда.";
                }
            }
        } // Вот эта скобка закрывает функцию правильно, и код ниже больше не съезжает!

        function resetTool() {
            selectedTool = null;
            document.querySelectorAll('.tool-btn').forEach(function(btn) {
                btn.style.filter = 'none';
                btn.style.transform = 'none';
            });
        }

        function updateHint() {
            if (currentStage === 0) hintElement.innerText = "Выберите инструмент «Земля» справа";
            if (currentStage === 1) hintElement.innerText = "Отлично! Теперь выберите «Семена»";
            if (currentStage === 2) hintElement.innerText = "Росток появился! Выберите «Вода» для полива";
            if (currentStage === 3) hintElement.innerText = "Красота! Кликните на цветок, чтобы собрать пыльцу";
        }

        function openCatalog() {
            alert("📖 Здесь будет открываться ваш красивый блокнот-гербарий!");
        }

        function saveGame() {
            localStorage.setItem('cozy_garden_coins', coins);
            localStorage.setItem('cozy_garden_stage', currentStage);
        }

        function loadGame() {
            const savedCoins = localStorage.getItem('cozy_garden_coins');
            const savedStage = localStorage.getItem('cozy_garden_stage');
            
            if (savedCoins !== null) {
                coins = parseInt(savedCoins);
                coinsElement.innerText = coins;
            }
            if (savedStage !== null) {
                currentStage = parseInt(savedStage);
                if (currentStage === 0) potElement.src = 'pot_empty.png';
                if (currentStage === 1) potElement.src = 'pot_dirt.png';
                if (currentStage === 2) potElement.src = 'pot_sprout.png';
                if (currentStage === 3) potElement.src = 'pot_flower.png';
            }
            updateHint();
        }
    </script>
</body>
</html>

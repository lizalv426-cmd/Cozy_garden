<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Уютный Гербарий</title>
<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b2b2b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

                /* Перелив солнечного света */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* Ограничиваем ширину игры, как на экране телефона */
            height: 100vh;    /* Намертво растягиваем игру на всю высоту экрана */
            margin: 0 auto;   /* Выравниваем всю игру строго по центру экрана компьютера */
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden; /* Прячем всё, что пытается вылезти за границы экрана телефона */
        }

        @keyframes sunlightPulse {
            0% { 
                opacity: 0.2; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.6; 
                transform: scale(1.03) translate(3px, 3px); 
            } 
            100% { 
                opacity: 0.2; 
                transform: scale(1);
            }
        }


        /* Стол */
        #game-table {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            pointer-events: none;
            z-index: 5;
        }

        /* Позиционирование котика ровно на кресле */
        #game-cat {
            position: absolute;
            bottom: 385px;   /* Спустили кота с потолка прямо на уровень подушки */
            left: 50%;       
            transform: translateX(-24px); /* Подвинули левее, чтобы он идеально перекрыл кота на фоне */
            width: 82px;     /* Оптимальный размер пушистика */
            height: auto;
            pointer-events: none; 
            z-index: 4;      
        }

        /* Горшочек на столе */
        #game-pot {
            position: absolute;
            bottom: 220px; 
            left: 50%;
            transform: translateX(-50%);
            width: 130px; 
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 10;
        }
        #game-pot:active {
            transform: translateX(-50%) scale(0.95);
        }

                /* НЕВИДИМЫЕ КРУГИ ДЛЯ 5 КНОПОК МЕНЮ */
        .menu-circle-click {
            position: absolute;
            bottom: 22px;      /* Высота кружков от низа */

            height: 72px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 45;
            /* background-color: rgba(255, 0, 0, 0.3); */ /* Раскомментируйте, чтобы увидеть зоны при тесте! */
        }
        
        /* Рассаживаем 5 зон по кнопкам на панели */

        #btn-menu-inventory { left: 24%; }
        #btn-menu-garden { left: 43%; }
        #btn-menu-shop { left: 62%; }
        #btn-menu-achievements { left: 81%; }

                /* КОНТЕЙНЕР ДЛЯ НАШЕЙ ИЗЯЩНОЙ ВЕТОЧКИ */
        #tools-drop-menu {
            display: none;     /* Изначально прячем */
            position: absolute;
            bottom: 90px;      /* Поднимаем четко над деревянным бортиком меню */
            left: 15px;        /* Подвинули ближе к кнопке инструментов */
            width: 170px;      /* Аккуратный размер веточки */
            height: 190px;     /* Четко задаем высоту контейнера для правильного отсчета bottom */

        #tools-menu-img {

            height: auto;

        }

        /* КРУГЛЫЕ ЗОНЫ КЛИКА НА ВЕТОЧКЕ */

            position: absolute;

        }

        #exp-wrapper {

        }
        #btn-music:active {
            transform: scale(0.9);
        }
        #btn-music.muted {
            filter: grayscale(100%) opacity(50%);
        }

        /* СТИЛИ ДЛЯ ВСПЛЫВАЮЩЕГО ОКНА МАГАЗИНА */
        #catalog-modal {

        /* Рассаживаем 5 зон по кнопкам на панели */

        #btn-menu-garden { left: 43%; }

        #btn-menu-achievements { left: 81%; }

        /* КОНТЕЙНЕР ДЛЯ НАШЕЙ НОВОЙ ВЕТОЧКИ */
        #tools-drop-menu {

        <script>
        // 1. ГЛАВНЫЕ ИГРОВЫЕ ПЕРЕМЕННЫЕ
        let currentStage = 0; // 0 - пустой, 1 - земля, 2 - росток, 3 - цветок
        let coins = 0;
        let selectedTool = null;
        let musicStarted = false;
        let isMuted = false;
        
        // Переменные для таймера времени
        let growthTimer = null;
        let isGrowing = false;
        const GROWTH_TIME = 15; // Время роста цветка в секундах для теста

        // 2. СВЯЗЬ С КАРТИНКАМИ НА ЭКРАНЕ
        const potElement = document.getElementById('game-pot');
        const coinsElement = document.getElementById('coins');
        const hintElement = document.getElementById('game-hint');
        const musicElement = document.getElementById('bg-music');
        const btnMusic = document.getElementById('btn-music');

        // Автоматически подгружаем сохранения при старте
        loadGame();

        // 3. ФУНКЦИИ МУЗЫКИ
        function startMusic() {
            if (!musicStarted && !isMuted && musicElement) {
                musicElement.volume = 0.3; // Уютная негромкая музыка на 30%
                musicElement.play().catch(function(e) {
                    console.log("Ожидание клика для запуска звука");
                });
                musicStarted = true;
            }
        }

        function toggleMusic() {
            if (!musicStarted) {
                musicStarted = true;
                musicElement.volume = 0.3;
                musicElement.play();
            }
            if (isMuted) {
                musicElement.muted = false;
                isMuted = false;
                btnMusic.classList.remove('muted');
            } else {
                musicElement.muted = true;
                isMuted = true;
                btnMusic.classList.add('muted');
            }
        }


        // 5. ФУНКЦИЯ КЛИКА ПО ГОРШОЧКУ
        function clickPot() {
            if (isGrowing) return; // Защита: блокируем клики во время роста
            
            try { startMusic(); } catch(e) { console.log(e); }
            
            // Шаг 1: Насыпаем землю
            if (currentStage === 0 && selectedTool === 'dirt') {
                currentStage = 1;
                potElement.src = 'pot_dirt.png';
                resetTool();
                updateHint();
                saveGame(); 
            } 
            // Шаг 2: Сажаем семена -> Росток
            else if (currentStage === 1 && selectedTool === 'seed') {
                currentStage = 2;
                potElement.src = 'pot_sprout.png'; 
                resetTool();
                updateHint();
                saveGame();
            } 
            // Шаг 3: Полив и ЗАПУСК ТАЙМЕРА роста
            else if (currentStage === 2 && selectedTool === 'water') {
                resetTool();
                startGrowthProcess();
            } 
            // Шаг 4: Сбор готового цветка
            else if (currentStage === 3) {
                coins += 3; 
                coinsElement.innerText = coins;
                currentStage = 0;
                potElement.src = 'pot_empty.png';
                updateHint();
                saveGame();
            }
            else {
                if (currentStage === 3) {
                    hintElement.innerText = "Соберите выросший суккулент пальчиком!";
                } else {
                    hintElement.innerText = "Этот инструмент сейчас не подходит сюда.";
                }
            }
        }

        // 6. ФУНКЦИЯ НАСТОЯЩЕГО ТАЙМЕРА РОСТА
        function startGrowthProcess() {
            isGrowing = true;
            let timeLeft = GROWTH_TIME;
            
            // Визуально блокируем кнопки (делаем их черно-белыми)
            document.querySelectorAll('.tool-btn').forEach(function(btn) {
                btn.classList.add('disabled');
            });
            
            hintElement.innerText = "Водичка впиталась! Цветок растет... (" + timeLeft + " сек)";
            
            growthTimer = setInterval(function() {
                timeLeft--;
                if (timeLeft > 0) {
                    hintElement.innerText = "Водичка впиталась! Цветок растет... (" + timeLeft + " сек)";
                } else {
                    // Время вышло! Цветок вырос
                    clearInterval(growthTimer);
                    isGrowing = false;
                    currentStage = 3;
                    potElement.src = 'pot_flower.png';
                    
                    // Возвращаем кнопкам былую яркость
                    document.querySelectorAll('.tool-btn').forEach(function(btn) {
                        btn.classList.remove('disabled');
                    });
                    
                    updateHint();
                    saveGame();
                }
            }, 1000);
            
            saveGame();
        }

        // 7. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        function resetTool() {
            selectedTool = null;
            document.querySelectorAll('.tool-btn').forEach(function(btn) {
                btn.style.filter = 'none';
                btn.style.transform = 'none';
            });
        }

        function updateHint() {
            if (isGrowing) return;
            if (currentStage === 0) hintElement.innerText = "Выберите инструмент «Земля» справа";
            if (currentStage === 1) hintElement.innerText = "Отлично! Теперь выберите «Семена»";
            if (currentStage === 2) hintElement.innerText = "Росток появился! Выберите «Вода» для полива";
            if (currentStage === 3) hintElement.innerText = "Красота! Кликните на цветок, чтобы собрать пыльцу";
        }

         // Функция, которая открывает блокнот-гербарий
        function openCatalog() {
            // Находим наше скрытое окно по его ID и меняем 'none' на 'flex' (сделать видимым)
            document.getElementById('catalog-modal').style.display = 'flex';
        }

        // Функция, которая закрывает блокнот-гербарий
        function closeCatalog() {
            // Снова прячем окно, возвращая ему значение 'none'
            document.getElementById('catalog-modal').style.display = 'none';
        }

        // 8. СИСТЕМА ЛОКАЛЬНОГО СОХРАНЕНИЯ ПРОГРЕССА
        function saveGame() {
            localStorage.setItem('cozy_garden_coins', coins);
            localStorage.setItem('cozy_garden_stage', currentStage);
            localStorage.setItem('cozy_garden_growing', isGrowing);
        }

        function loadGame() {
            const savedCoins = localStorage.getItem('cozy_garden_coins');
            const savedStage = localStorage.getItem('cozy_garden_stage');
            const savedGrowing = localStorage.getItem('cozy_garden_growing');
            
            if (savedCoins !== null) {
                coins = parseInt(savedCoins);
                coinsElement.innerText = coins;
            }
            
            if (savedGrowing === 'true' || savedStage === '2') {
                currentStage = 2;
                potElement.src = 'pot_sprout.png';
            } else if (savedStage !== null) {
                currentStage = parseInt(savedStage);
                if (currentStage === 0) potElement.src = 'pot_empty.png';
                if (currentStage === 1) potElement.src = 'pot_dirt.png';
                if (currentStage === 3) potElement.src = 'pot_flower.png';
            }
            updateHint();
        }
    </script>
</body>
</html>
